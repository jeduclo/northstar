name: Daily data refresh

on:
  schedule:
    - cron: "0 14 * * 1-5"   # 10:00 ET weekdays (after 8:30 ET StatCan/BLS releases)
  workflow_dispatch:           # "Run workflow" button for manual refreshes

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt

      - name: Ingest (all sources)
        run: python -m pipeline.audit

      - name: Build warehouse
        run: python -m pipeline.build

      - name: Export web data
        run: python -m pipeline.export

      - name: Commit refreshed data (push triggers Vercel deploy)
        run: |
          git config user.name "northstar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
